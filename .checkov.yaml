# Cấu hình Checkov cho project3 (W8 - shift-left gate).
#
# Chạy toàn bộ check Terraform mặc định + check tự viết. Việc chặn hay chỉ cảnh báo
# do .github/scripts/checkov_gate.py quyết định theo .github/checkov-severity.json:
# HIGH/CRITICAL chặn build, MEDIUM/LOW chỉ cảnh báo.
framework:
  - terraform

external-checks-dir:
  - .github/checkov-policies

# Waiver có kiểm soát: mỗi skip-check PHẢI ghi rõ lý do.
skip-check:
  - CKV_AWS_144  # Sao chép S3 khác region: tốn phí, dữ liệu demo không cần DR
  - CKV_AWS_145  # S3 dùng KMS CMK: tốn phí, SSE-S3 (AES256) đủ cho dữ liệu demo
  - CKV_AWS_136  # ECR dùng KMS CMK: tốn phí, AES256 đủ cho image demo
  - CKV2_AWS_62  # Event notification S3: không có luồng xử lý nào cần sự kiện này

compact: true
