# CI Terraform — W7 (apply thủ công).
# - PR hoặc push vào main: fmt + validate + plan (KHÔNG apply, không tạo tài nguyên).
# - apply: CHỈ chạy khi bấm thủ công (Actions -> Run workflow), phải gõ "apply" xác nhận.
# Xác thực AWS qua GitHub OIDC (KHÔNG dùng access key tĩnh).
# Checkov sẽ thêm ở W8.

name: ci-terraform

on:
  pull_request:
    paths:
      - "modules/**"
      - "envs/**"
      - ".github/workflows/ci-terraform.yml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "envs/**"
      - ".github/workflows/ci-terraform.yml"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ "apply" để xác nhận TẠO/ĐỔI hạ tầng thật trên AWS'
        required: true
        default: "no"

# Cần cho OIDC assume role.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.10.5"
  WORKDIR: envs/dev
  # Đặt trong repo Variables: Settings -> Secrets and variables -> Actions -> Variables.
  DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  # Chạy trên PR và push main — chỉ xem trước, an toàn.
  plan:
    name: validate + plan
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -input=false

      - name: terraform validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate

      - name: terraform plan
        working-directory: ${{ env.WORKDIR }}
        run: terraform plan -input=false -no-color

  # Chỉ chạy khi bấm "Run workflow" thủ công VÀ gõ đúng "apply".
  apply:
    name: apply (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -input=false -auto-approve

  # checkov:  # THÊM Ở W8 — quét IaC, xuất SARIF, gate HIGH/CRITICAL
