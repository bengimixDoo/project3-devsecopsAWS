# CI Terraform — W8 (Checkov gate + apply thủ công).
# - checkov: quét IaC trên MỌI push/PR, HIGH/CRITICAL -> job đỏ (shift-left gate), SARIF lên tab Security.
# - plan: chỉ chạy trên PR / push main, và CHỈ khi checkov xanh.
# - apply: CHỈ chạy khi bấm thủ công (Actions -> Run workflow), gõ "apply", và checkov xanh.
# - prowler: quét CSPM sau khi apply xong (W9, xem cspm-prowler.yml).
# Xác thực AWS qua GitHub OIDC (KHÔNG dùng access key tĩnh).

name: ci-terraform

on:
  # Không lọc paths: checkov là status check bắt buộc của main, nếu PR chỉ sửa docs mà
  # workflow không chạy thì PR kẹt ở "Expected — Waiting for status".
  pull_request:
  push:
    branches: ["**"]
    paths:
      - "modules/**"
      - "envs/**"
      - ".checkov.yaml"
      - ".github/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ "apply" để xác nhận TẠO/ĐỔI hạ tầng thật trên AWS'
        required: true
        default: "no"

# Cần cho OIDC assume role.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: "1.10.5"
  WORKDIR: envs/dev
  # Đặt trong repo Variables: Settings -> Secrets and variables -> Actions -> Variables.
  DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

jobs:
  # W8: gate bảo mật shift-left. Không cần AWS credentials -- chỉ quét code.
  checkov:
    name: checkov (security gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli,json,sarif
          output_file_path: console,results_json.json,results.sarif
          # Không fail ở đây; bước gate bên dưới quyết định + tạo annotation.
          soft_fail: true

      # Upload trước gate để finding vẫn lên tab Security khi build bị chặn.
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: checkov

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkov gate
        run: python .github/scripts/checkov_gate.py results_json.json

  # Chạy trên PR và push main — chỉ xem trước, an toàn. Chờ checkov xanh.
  plan:
    name: validate + plan
    needs: checkov
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt (check)
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -input=false

      - name: terraform validate
        working-directory: ${{ env.WORKDIR }}
        run: terraform validate

      - name: terraform plan
        working-directory: ${{ env.WORKDIR }}
        run: terraform plan -input=false -no-color

  # Chỉ chạy khi bấm "Run workflow" thủ công VÀ gõ đúng "apply".
  apply:
    name: apply (manual)
    needs: checkov
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -input=false -auto-approve

  # W9: quét CSPM ngay sau mỗi lần apply thành công.
  prowler:
    name: prowler sau apply
    needs: apply
    uses: ./.github/workflows/cspm-prowler.yml
    permissions:
      contents: read
      id-token: write
